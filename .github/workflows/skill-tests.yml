name: SmartHire AI skill tests

on:
  pull_request:
    paths:
      - "nlp-service/**"
      - ".github/workflows/skill-tests.yml"
  push:
    branches:
      - main
      - "upgrade/ai-skill-recognition-v2"
    paths:
      - "nlp-service/**"
      - ".github/workflows/skill-tests.yml"

jobs:
  skill-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nlp-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip flask scikit-learn

      - name: Run skill-recognition regression tests
        run: python -m unittest -v test_skill_matching.py
