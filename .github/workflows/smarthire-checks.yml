name: SmartHire checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/mobile-matching-resumes"]
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: find server -path 'server/node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m compileall -q nlp-service
      - name: Install skill-test dependencies
        run: python -m pip install flask scikit-learn
      - name: Run skill-matching regression tests
        working-directory: nlp-service
        run: python -m unittest -v test_skill_matching.py
